# Egress proxy for the sandbox's install window (PHASE-5 step 5.9).
#
# The only thing this process is for: turn "the sandbox has the whole internet for 90
# seconds" into "the sandbox has six hosts for 90 seconds". It is not a cache, not a
# TLS-terminating inspector, and not an authenticating gateway.

Port 8888
Listen 0.0.0.0

# No User/Group directives. Those exist so a proxy started as root can drop privileges,
# and this one is never started as root — the Dockerfile's USER has already done it.
# Leaving them in makes tinyproxy try to setuid() as an unprivileged process, which
# fails, and 1.11 treats that as fatal.

# Logs to stdout. Set deliberately rather than by omission: with neither LogFile nor
# Syslog, tinyproxy 1.11 writes to stdout only while in the foreground, so `docker logs`
# working would be a side effect of how the container happens to be started. `Syslog Off`
# + no LogFile is the explicit form of the same thing.
Syslog Off
LogLevel Info

PidFile "/tmp/tinyproxy.pid"

# --- who may use the proxy ------------------------------------------------------------
# With no Allow lines at all tinyproxy accepts every client, which on a docker bridge is
# every container on the network plus anything that can reach a published port. These
# three are the RFC1918 ranges docker allocates bridge subnets from; the proxy is never
# published to the host, so this is a second fence rather than the only one.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# --- the allow-list -------------------------------------------------------------------
# FilterDefaultDeny inverts the filter file's meaning: the file becomes the set of hosts
# that are *permitted*, everything else is 403 Filtered. Without this line the same file
# would be a block-list and the proxy would be wide open.
Filter "/etc/tinyproxy/allowlist.txt"
FilterDefaultDeny Yes

# Extended POSIX regex, so `(^|\.)host$` alternation in the allow-list means what it
# looks like. Under the default (basic) syntax `(`, `)` and `|` are literals and such a
# line silently matches nothing — a fail-closed failure, but a confusing one.
FilterExtended On

# Case-insensitive. DNS is case-insensitive, so `CONNECT PyPI.org:443` is the same
# request as `CONNECT pypi.org:443`; a case-sensitive filter would deny the first and
# allow the second, which is a bypass for anything that normalises differently.
FilterCaseSensitive Off

# Match the host, not the full URL. FilterURLs On would compare the allow-list against
# `pypi.org/simple/...` — which still works for CONNECT (there is no path in a CONNECT
# request) but would break plain-HTTP requests against the same anchored patterns, so the
# two transports would enforce different rules.
FilterURLs Off

# --- what CONNECT may reach -----------------------------------------------------------
# The port half of the allow-list. With no ConnectPort lines tinyproxy permits CONNECT to
# any port, so an allow-listed host would also be an allow-listed SSH/SMTP/arbitrary-TCP
# relay: `CONNECT github.com:22` is a git-over-ssh tunnel out of the sandbox, and
# `CONNECT github.com:1194` is whatever the far end is listening on. 443 only.
ConnectPort 443

# --- resource limits ------------------------------------------------------------------
# One install's worth of parallelism. uv and npm open a lot of sockets at once; 100 is
# comfortably above what a dependency tree needs and far below what would let one
# sandbox's runaway loop starve another's install.
MaxClients 100

# Seconds an idle connection is held. Package downloads stall on slow mirrors; 600 is
# tinyproxy's own default and there is no reason here to be tighter.
Timeout 600

ViaProxyName "agent-egress"

# The built-in status page, reachable only by asking for this exact host through the
# proxy. Named off the default (`tinyproxy.stats`) so that it cannot collide with a real
# DNS name, and used by the image's HEALTHCHECK.
StatHost "egress.stats"

# Error pages are the proxy's own. The default templates name tinyproxy and its version
# in the body; that is fine for a container nothing outside the install network can
# reach, and the 403 body is what makes a denied install self-explaining in a run log.
