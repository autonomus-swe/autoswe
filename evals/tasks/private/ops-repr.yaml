# Small, unambiguous, and verifiable without reading the diff. The point of a task like
# this in a suite is calibration: if the agent cannot do this one, a failure on a harder
# task says nothing about the harder task.
#
# The goal names the test file and `verify` runs that file alone. Both are deliberate.
# This fixture's baseline suite does not pass — `tests/test_ops.py` imports `subtract` and
# `slugify`, which is the M1 task's whole point — so a task that verified with a bare
# `pytest -q` could never resolve, and would report the agent as having failed at
# something it was never asked to do.
id: ops-repr
repo: "${AUTOSWE_FIXTURE_REPO}"
base: main
goal: >-
  Add a dataclass Point with integer fields x and y to fixture/ops.py, with a __repr__
  that renders exactly as Point(x=1, y=2). Put its tests in a new file tests/test_point.py
  and do not modify tests/test_ops.py.
verify:
  command: "uv run pytest -q tests/test_point.py"
  expect_exit: 0
tags: [feature, fixture]
budget_usd: 3.0
