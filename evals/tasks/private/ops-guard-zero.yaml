# A bugfix shape rather than a feature: the change is a guard, and the test that proves it
# has to be written by the agent.
#
# Its own test file, for the reason in ops-repr.yaml: this fixture's baseline suite does
# not pass, so a whole-suite verify would fail for a reason that is about the fixture
# rather than about the agent.
id: ops-guard-zero
repo: "${AUTOSWE_FIXTURE_REPO}"
base: main
goal: >-
  Add divide(a, b) to fixture/ops.py. It must raise ValueError with a clear message when b
  is zero rather than letting ZeroDivisionError escape. Put its tests in a new file
  tests/test_divide.py covering both the normal case and the zero case, and do not modify
  tests/test_ops.py.
verify:
  command: "uv run pytest -q tests/test_divide.py"
  expect_exit: 0
tags: [bugfix, fixture]
budget_usd: 3.0
