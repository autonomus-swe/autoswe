name: ci
on:
  push:
  pull_request:
jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: make lint
      - run: make type
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run pytest -m unit --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv python install 3.12
      - run: uv sync --all-extras
      # Without this image every sandbox test — resume after SIGKILL, cancel, the full
      # loop — skips instead of running, and the tier goes green while proving nothing.
      - run: make sandbox-image
      - run: docker image inspect agent-sandbox:python-3.12 --format 'sandbox image {{.Id}}'
      - run: make test-int
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The gitleaks CLI is Apache-2.0 and needs no key. Only the Action wrapper demands
      # a paid licence for organisation-owned repos, which failed every run on main since
      # the repo moved into the org — red for a billing reason, not a finding, which is
      # the fastest way to teach everyone to ignore CI. Pinned to the version
      # .pre-commit-config.yaml uses, so local and CI agree on the rules.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks --version
          /tmp/gitleaks git --config .gitleaks.toml --redact --verbose .
