services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: autoswe
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      # TCP check on purpose: the first-boot initdb runs a temporary server that
      # only listens on the Unix socket, so a socket-based pg_isready would report
      # "healthy" before the real server is up.
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoswe -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
  # The egress proxy, off unless asked for: `docker compose --profile proxy up -d`.
  #
  # It is the only route out of `agent-egress`, which is an `internal` network with no
  # default route — so the allow-list in proxy/allowlist.txt is the whole egress policy for
  # a dependency install rather than a suggestion beside one.
  #
  # Attached to both networks on purpose: `agent-egress` to be reachable by the sandbox,
  # the default one to be able to reach anything at all.
  #
  # `no-new-privileges` is deliberately absent. It is present on the sandbox, but on hosts
  # whose AppArmor profile needs the setuid transition it stops tinyproxy from execing at
  # all — the same quirk sandbox/docker.py documents and falls back from. Everything else
  # that matters is here: non-root, all capabilities dropped, read-only rootfs.
  egress-proxy:
    profiles: ["proxy"]
    build: {context: ./proxy}
    container_name: agent-egress-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    networks: [default, agent-egress]
    healthcheck:
      # Probes the FILTER, not the port. A tinyproxy whose allow-list failed to load runs
      # wide open and answers a TCP check perfectly happily — measured — so the check asks
      # for a host that must be refused and expects the refusal.
      test:
        - CMD-SHELL
        - >-
          http_proxy=http://127.0.0.1:8888 wget -q -O /dev/null https://pypi.org/simple/ &&
          ! http_proxy=http://127.0.0.1:8888 wget -q -O /dev/null http://example.com
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # The API and worker are optional: `make up` starts only postgres and redis, and the
  # demo runs them on the host. Start them with `docker compose --profile app up -d`.
  api:
    profiles: ["app"]
    build: {context: ., dockerfile: deploy/Dockerfile}
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:dev@postgres:5432/autoswe
      REDIS_URL: redis://redis:6379/0
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    profiles: ["app"]
    build: {context: ., dockerfile: deploy/Dockerfile}
    command: ["arq", "orchestrator.worker.WorkerSettings"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:dev@postgres:5432/autoswe
      REDIS_URL: redis://redis:6379/0
    # The daemon resolves bind-mount sources on the host, so the worktree path must be
    # identical inside and outside this container. A named volume cannot work here.
    user: "${SANDBOX_UID:-1000}:${SANDBOX_GID:-1000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKTREES_DIR:-/var/agent/worktrees}:${WORKTREES_DIR:-/var/agent/worktrees}
      - ${REPOS_DIR:-/var/agent/repos}:${REPOS_DIR:-/var/agent/repos}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

networks:
  # Declared `external` because the worker creates it — and creates it `internal`. A plain
  # compose entry would make `<project>_agent-egress`, a different network from the one the
  # sandbox joins, and the proxy would sit on a bridge nothing could reach. Measured.
  agent-egress:
    external: true

volumes:
  pgdata: {}
