services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: autoswe
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      # TCP check on purpose: the first-boot initdb runs a temporary server that
      # only listens on the Unix socket, so a socket-based pg_isready would report
      # "healthy" before the real server is up.
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoswe -h localhost"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata: {}
  worktrees: {}
