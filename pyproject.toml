[project]
name = "autoswe"
version = "0.5.0"
description = "Autonomous software engineering agent: control plane, orchestrator, agents, tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "structlog>=24.1",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  # OTLP over HTTP rather than gRPC: it is the protocol every collector accepts, and it is
  # what Langfuse's OTLP endpoint speaks, which is how traces reach it without a second SDK.
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  # Prometheus counters and histograms. In the base dependencies rather than an extra
  # because both the API and the worker expose an endpoint, and they share nothing else.
  "prometheus-client>=0.20",
  "orjson>=3.10",
  "typer>=0.12",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "mcp>=1.12",
]
cli = ["httpx>=0.27"]
worker = [
    "arq>=0.26",
    # The symbol index. One wheel carries the grammars for every language the index
    # supports, so adding a language is a query file rather than a build step.
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    # Repo map v2's lexical half. The centrality half is fifteen lines in `repo/graph.py`
    # rather than networkx, whose `pagerank` needs scipy — forty megabytes for one call.
    "rank-bm25>=0.2.2",
    # pgvector's SQLAlchemy type, so `vector(1024)` round-trips as a list of floats.
    "pgvector>=0.3",
    # pip-audit queries the advisory database over the network, so it runs on the worker
    # and never in the sandbox. A dependency rather than a binary because the worker runs
    # as a host process in development and in a container in compose, and it has to be
    # there in both.
    "pip-audit>=2.7",
    "docker>=7.1",
    "GitPython>=3.1",
    "PyGithub>=2.4",
    "anthropic>=0.116",
    "openai>=1.50",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "testcontainers[postgres,redis]>=4.8",
  # the sandbox installs this to produce reports; the host needs it to verify that the
  # chaos fixtures still fail the way their README says they do
  "pytest-json-report>=1.5",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "httpx>=0.27",
]

[project.scripts]
autoswe = "cli.main:app"
# Its own console script rather than `autoswe mcp`, because an editor's MCP config runs
# one command and typer prints its own diagnostics to stdout — which on this transport is
# the protocol. See the module docstring in cli/mcp.py.
autoswe-mcp = "cli.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "api", "orchestrator", "agents", "tools", "sandbox", "repo", "gateway",
  "contracts", "storage", "mcp_bridge", "observability", "cli", "evals", "core",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["storage/migrations/versions", "tests/fixtures", "*.md"]  # docs hold illustrative pseudo-code

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is a call in the argument default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# never type-check installed packages: their source is not ours to fix
exclude = ["storage/migrations/", "tests/fixtures/", "\\.venv/", "venv/"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information. Their source is not ours to fix.
module = ["testcontainers.*", "asyncpg.*", "docker.*", "arq.*", "rank_bm25.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "unit: no I/O",
  "integration: needs Postgres/Redis/Docker via testcontainers",
  # Separate from `integration` because the dependency is genuinely different, and the
  # difference is the point: these check caching and model routing against a real server
  # and need no database, no Docker and no key. Under `tests/integration/` they would
  # inherit that package's autouse fixture and start two containers they never touch,
  # which is both slow and a lie about what they require.
  "live: needs a local model server (Ollama); no database, no key",
  "e2e: needs real API keys; never in CI by default",
]
addopts = "-q -m 'not e2e' --ignore=tests/fixtures"
norecursedirs = ["tests/fixtures", ".venv", "storage/migrations"]
filterwarnings = [
  "error::pytest.PytestCollectionWarning",
  # testcontainers 4.13 deprecates its own internal @wait_container_is_ready decorator
  # (emitted at import time from the library's own modules); nothing in this repo uses it.
  "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning:testcontainers",
]

[[tool.mypy.overrides]]
# urllib3 ships py.typed, so mypy type-checks its source and trips over syntax it does
# not support. Their code is not ours to fix; skip it.
module = ["urllib3.*"]
follow_imports = "skip"
